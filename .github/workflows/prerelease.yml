name: prerelease
# Публикует готовые jar как ПРЕРЕЛИЗ (не релиз). Запускается пушем тега вида
# <мод>-<версия> (например cld_far-0.2.0); jar берутся из releases/<тег>/.
on:
  push:
    tags: ['*-[0-9]*']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          files=(releases/"$TAG"/*.jar releases/"$TAG"/*.zip)
          [ ${#files[@]} -gt 0 ] || { echo "нет файлов в releases/$TAG"; exit 1; }
          notes=releases/"$TAG"/NOTES.md
          [ -f "$notes" ] || echo "Тестовая сборка $TAG." > "$notes"
          gh release create "$TAG" "${files[@]}" --prerelease --title "$TAG" --notes-file "$notes" --verify-tag
