name: prerelease
# Публикует готовые jar как ПРЕРЕЛИЗ (не релиз). Источник — каталог releases/<мод>-<версия>/
# (jar/zip + NOTES.md). Запускается пушем коммита с новым каталогом releases/<тег>/;
# тег создаётся автоматически на этом коммите. Уже опубликованные теги пропускаются.
on:
  push:
    paths: ['releases/**']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish prereleases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          for dir in releases/*/; do
            tag=$(basename "$dir")
            if gh release view "$tag" >/dev/null 2>&1; then continue; fi
            files=("$dir"*.jar "$dir"*.zip)
            [ ${#files[@]} -gt 0 ] || continue
            notes="$dir"NOTES.md
            [ -f "$notes" ] || echo "Тестовая сборка $tag." > "$notes"
            gh release create "$tag" "${files[@]}" --prerelease --title "$tag" --notes-file "$notes" --target "$GITHUB_SHA"
          done
